spring.application.name=product-api

# =========================================================
# Database Configuration
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# JWT Configuration
# =========================================================

jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-secret-value}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}